<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MiEquipo | Prototipo académico</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173329;background:#f0f5f1}*{box-sizing:border-box}body{margin:0}.shell{max-width:470px;min-height:100vh;margin:auto;background:#f8faf8;box-shadow:0 0 24px #17332914}header{background:#16633e;color:white;padding:24px 22px 18px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#e0f1e6;font-size:13px}main{padding:20px}h2{font-size:21px;margin:0 0 15px}.card{background:white;border:1px solid #d9e7dd;border-radius:16px;padding:19px;margin:0 0 16px;box-shadow:0 3px 9px #1a513013}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#467a5d}.detail{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef2ef;padding:11px 0}.detail:last-child{border:0}.muted{color:#526b5b}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#177342;color:white;font-size:15px;font-weight:700;cursor:pointer;margin:10px 0}.btn.secondary{background:white;color:#16633e;border:2px solid #16633e}.btn:focus-visible,input:focus-visible{outline:3px solid #ffbe3d;outline-offset:2px}.toolbar{display:flex;gap:10px}.toolbar .btn{flex:1}.hidden{display:none}label{display:block;font-weight:650;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #b7c9bc;border-radius:9px;font:inherit}.player{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1ed}.tag{font-size:12px;border-radius:20px;padding:5px 9px;background:#e7f5eb;color:#17613c}.tag.pending{background:#fff2d9;color:#765416}.notice{padding:12px;border-radius:10px;background:#e7f5eb;color:#145333;margin:12px 0;font-weight:650}footer{padding:18px 22px;color:#617369;font-size:12px;text-align:center}
</style></head><body><div class="shell"><header><h1>⚽ MiEquipo</h1><p>Organiza tus partidos de fútbol amateur</p></header><main>
<section id="inicio"><h2>Próximo partido</h2><div class="card"><div class="eyebrow">Convocatoria</div><div id="resumen"></div><button class="btn" onclick="ir('jugadores')">Ver jugadores</button><button class="btn secondary" onclick="ir('detalle')">Ver detalle</button></div><button class="btn" onclick="ir('crear')">+ Crear partido</button></section>
<section id="crear" class="hidden"><h2>Crear partido</h2><div class="card"><form id="formPartido"><label for="fecha">Fecha</label><input id="fecha" type="date" required><label for="hora">Hora</label><input id="hora" type="time" required><label for="cancha">Cancha o lugar</label><input id="cancha" type="text" maxlength="80" placeholder="Ej.: Cancha municipal" required><label for="cupos">Cantidad de cupos</label><input id="cupos" type="number" min="1" max="50" value="10" required><button class="btn" type="submit">Guardar partido</button></form><button class="btn secondary" onclick="ir('inicio')">Cancelar</button></div></section>
<section id="jugadores" class="hidden"><h2>Jugadores</h2><div class="card"><p class="muted">Nómina demostrativa del próximo encuentro</p><div id="lista"></div><button id="confirmar" class="btn" onclick="confirmarAsistencia()">Confirmar asistencia</button><div id="mensajeJugadores" role="status" aria-live="polite"></div><button class="btn secondary" onclick="ir('detalle')">Ver detalle del partido</button><button class="btn secondary" onclick="ir('inicio')">Volver al inicio</button></div></section>
<section id="detalle" class="hidden"><h2>Detalle del partido</h2><div class="card"><div id="detalleContenido"></div><div id="mensajeDetalle" role="status" aria-live="polite"></div><button class="btn" onclick="ir('jugadores')">Ver jugadores</button><button class="btn secondary" onclick="ir('inicio')">Volver al inicio</button></div></section>
</main><footer>Prototipo académico de fidelidad media · Datos de demostración · Sin servidor</footer></div>
<script>
let partido={fecha:'2026-11-21',hora:'19:00',cancha:'Cancha municipal',cupos:10};let confirmado=false;let aviso='';const jugadores=[{nombre:'Camila',estado:'Confirmado'},{nombre:'Diego',estado:'Confirmado'},{nombre:'Francisco',estado:'Pendiente'},{nombre:'Tú',estado:'Pendiente'}];
function formatoFecha(s){const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function fila(k,v){return `<div class="detail"><span class="muted">${k}</span><strong>${v}</strong></div>`}
function datos(){return fila('Fecha',formatoFecha(partido.fecha))+fila('Hora',partido.hora)+fila('Cancha',escapeHtml(partido.cancha))+fila('Cupos',String(partido.cupos))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pintar(){document.getElementById('resumen').innerHTML=datos();document.getElementById('detalleContenido').innerHTML=datos()+fila('Tu asistencia',confirmado?'Confirmada':'Pendiente');document.getElementById('lista').innerHTML=jugadores.map(j=>`<div class="player"><strong>${j.nombre}</strong><span class="tag ${j.estado==='Pendiente'?'pending':''}">${j.estado}</span></div>`).join('');document.getElementById('confirmar').disabled=confirmado;document.getElementById('confirmar').textContent=confirmado?'Asistencia confirmada':'Confirmar asistencia';document.getElementById('mensajeJugadores').innerHTML=confirmado?'<div class="notice">✓ Tu asistencia fue confirmada correctamente.</div>':'';document.getElementById('mensajeDetalle').innerHTML=aviso?`<div class="notice">${escapeHtml(aviso)}</div>`:''}
function ir(id){['inicio','crear','jugadores','detalle'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));pintar();window.scrollTo(0,0)}
function confirmarAsistencia(){confirmado=true;jugadores[3].estado='Confirmado';aviso='Tu asistencia fue confirmada correctamente.';pintar()}
document.getElementById('formPartido').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;partido={fecha:document.getElementById('fecha').value,hora:document.getElementById('hora').value,cancha:document.getElementById('cancha').value.trim(),cupos:Number(document.getElementById('cupos').value)};if(!partido.cancha){document.getElementById('cancha').setCustomValidity('Ingresa la cancha');f.reportValidity();document.getElementById('cancha').setCustomValidity('');return}confirmado=false;jugadores[3].estado='Pendiente';aviso='El partido se guardó correctamente en esta demostración.';f.reset();ir('detalle')});pintar();
</script></body></html>
